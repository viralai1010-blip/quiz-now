<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuizLand Clone</title>
    <style>
        body { margin: 0; padding: 0; background-color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ecf0f1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-container { width: 95%; max-width: 400px; background: #34495e; border-radius: 15px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: center; }
        #status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        #status-bar span { display: flex; align-items: center; gap: 5px; }
        #question-text { font-size: 20px; margin-bottom: 20px; min-height: 60px; }
        #answers { display: flex; flex-direction: column; gap: 10px; }
        .answer-btn { padding: 15px; font-size: 16px; border: none; border-radius: 8px; background: #3498db; color: white; cursor: pointer; transition: 0.3s; text-align: left; }
        .answer-btn:hover { background: #2980b9; }
        .answer-btn.correct { background: #2ecc71; }
        .answer-btn.wrong { background: #e74c3c; }
        #hints { margin-top: 20px; display: flex; justify-content: space-around; }
        .hint-btn { background: #f1c40f; color: #2c3e50; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 45%; }
        .hint-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        #map-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 20px; }
        .tile { aspect-ratio: 1; background: #7f8c8d; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; }
        .tile.exit { background: #e67e22; color: white; }
        .tile.revealed { background: #95a5a6; cursor: default; }
        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #game-over-screen h1 { font-size: 36px; color: #e74c3c; }
        #restart-btn { margin-top: 20px; padding: 15px 30px; font-size: 18px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="status-bar">
            <span>❤️ Lives: <span id="lives">3</span></span>
            <span>⭐ Score: <span id="score">0</span></span>
            <span>💰 Coins: <span id="coins">100</span></span>
        </div>

        <div id="map-container">
            <!-- سيتم توليد الخريطة هنا بواسطة JavaScript -->
        </div>

        <div id="question-area" style="display: none;">
            <div id="question-text"></div>
            <div id="answers"></div>
            <div id="hints">
                <button class="hint-btn" id="fifty-fifty-btn" onclick="useFiftyFifty()">50:50 (Cost: 20)</button>
                <button class="hint-btn" id="skip-btn" onclick="skipQuestion()">Skip (Cost: 15)</button>
            </div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>Game Over!</h1>
        <p id="game-over-reason"></p>
        <button id="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // بنك الأسئلة (يمكنك إضافة المزيد هنا)
        const questionBank = [
            { q: "What is the capital of France?", options: ["London", "Berlin", "Paris", "Madrid"], correct: 2 },
            { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
            { q: "Who painted the Mona Lisa?", options: ["Van Gogh", "Picasso", "Da Vinci", "Michelangelo"], correct: 2 },
            { q: "What is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
            { q: "Which element has the chemical symbol 'O'?", options: ["Gold", "Oxygen", "Silver", "Iron"], correct: 1 },
            { q: "What year did World War II end?", options: ["1942", "1945", "1950", "1939"], correct: 1 },
            { q: "Who wrote 'Hamlet'?", options: ["Charles Dickens", "William Shakespeare", "Mark Twain", "Jane Austen"], correct: 1 },
            { q: "What is the hardest natural substance on Earth?", options: ["Gold", "Iron", "Diamond", "Platinum"], correct: 2 },
            { q: "Which country is famous for the Great Wall?", options: ["Japan", "China", "India", "Egypt"], correct: 1 },
            { q: "What is the boiling point of water in Celsius?", options: ["90", "100", "110", "120"], correct: 1 }
        ];

        let lives = 3;
        let score = 0;
        let coins = 100;
        let mapTiles = [];
        let exitIndex = -1;
        let currentQuestion = null;
        let answeredQuestions = [];

        const livesEl = document.getElementById('lives');
        const scoreEl = document.getElementById('score');
        const coinsEl = document.getElementById('coins');
        const mapContainer = document.getElementById('map-container');
        const questionArea = document.getElementById('question-area');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverReason = document.getElementById('game-over-reason');
        const fiftyBtn = document.getElementById('fifty-fifty-btn');
        const skipBtn = document.getElementById('skip-btn');

        function initGame() {
            lives = 3;
            score = 0;
            coins = 100;
            answeredQuestions = [];
            updateUI();
            gameOverScreen.style.display = 'none';
            createMap();
        }

        function createMap() {
            mapContainer.innerHTML = '';
            mapTiles = [];
            exitIndex = Math.floor(Math.random() * 25); // 5x5 grid

            for (let i = 0; i < 25; i++) {
                let tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.index = i;
                tile.addEventListener('click', () => handleTileClick(i));
                mapContainer.appendChild(tile);
                mapTiles.push(tile);
            }
        }

        function handleTileClick(index) {
            const tile = mapTiles[index];

            if (tile.classList.contains('revealed') || tile.classList.contains('exit')) {
                return;
            }

            if (index === exitIndex) {
                // العثور على المخرج
                tile.classList.add('exit');
                tile.innerText = '🚪';
                // ربح مستوى
                coins += 50;
                updateUI();
                setTimeout(() => {
                    alert("You found the exit! Level Complete! +50 Coins");
                    createMap(); // ابدأ مستوى جديد
                }, 300);
                return;
            }

            // الكشف عن سؤال
            tile.classList.add('revealed');
            tile.innerText = '❓';
            loadQuestion(index);
        }

        function loadQuestion(tileIndex) {
            // اختيار سؤال عشوائي غير مجاب عليه
            let availableQuestions = questionBank.filter(q => !answeredQuestions.includes(q.q));
            if (availableQuestions.length === 0) {
                // إعادة تعيين إذا تم استخدام جميع الأسئلة
                answeredQuestions = [];
                availableQuestions = [...questionBank];
            }
            currentQuestion = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
            answeredQuestions.push(currentQuestion.q);

            questionText.innerText = currentQuestion.q;
            answersContainer.innerHTML = '';
            questionArea.style.display = 'block';

            currentQuestion.options.forEach((option, index) => {
                let btn = document.createElement('button');
                btn.classList.add('answer-btn');
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index, btn);
                answersContainer.appendChild(btn);
            });

            // إعادة تعيين أزرار التلميحات
            fiftyBtn.disabled = false;
            skipBtn.disabled = false;
            fiftyBtn.innerText = `50:50 (Cost: 20)`;
            skipBtn.innerText = `Skip (Cost: 15)`;
            fiftyBtn.style.display = 'inline-block';
        }

        function checkAnswer(selectedIndex, btn) {
            // تعطيل جميع الأزرار
            Array.from(answersContainer.children).forEach(b => b.disabled = true);

            if (selectedIndex === currentQuestion.correct) {
                btn.classList.add('correct');
                score += 10;
                coins += 5;
                updateUI();
                // إخفاء السؤال بعد الإجابة
                setTimeout(() => {
                    questionArea.style.display = 'none';
                    // يمكن للاعب اختيار سؤال آخر
                }, 1000);
            } else {
                btn.classList.add('wrong');
                // إظهار الإجابة الصحيحة
                answersContainer.children[currentQuestion.correct].classList.add('correct');
                lives--;
                updateUI();
                if (lives <= 0) {
                    endGame("You ran out of lives!");
                } else {
                    setTimeout(() => {
                        questionArea.style.display = 'none';
                    }, 1500);
                }
            }
        }

        function useFiftyFifty() {
            if (coins >= 20) {
                coins -= 20;
                updateUI();
                fiftyBtn.disabled = true;

                // إزالة إجابتين خاطئتين
                let wrongIndices = [];
                currentQuestion.options.forEach((_, index) => {
                    if (index !== currentQuestion.correct) wrongIndices.push(index);
                });
                // خلط واختيار اثنين
                wrongIndices.sort(() => Math.random() - 0.5);
                let toRemove = wrongIndices.slice(0, 2);

                toRemove.forEach(index => {
                    answersContainer.children[index].style.visibility = 'hidden';
                });
                fiftyBtn.innerText = "Used";
            } else {
                alert("Not enough coins!");
            }
        }

        function skipQuestion() {
            if (coins >= 15) {
                coins -= 15;
                updateUI();
                skipBtn.disabled = true;
                questionArea.style.display = 'none';
                skipBtn.innerText = "Skipped";
            } else {
                alert("Not enough coins!");
            }
        }

        function updateUI() {
            livesEl.innerText = lives;
            scoreEl.innerText = score;
            coinsEl.innerText = coins;
        }

        function endGame(reason) {
            gameOverReason.innerText = reason;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            initGame();
        }

        // بدء اللعبة
        initGame();
    </script>
</body>
</html>
